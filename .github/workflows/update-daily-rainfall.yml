name: Update daily rainfall data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-rainfall-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DAILY_RAIN_JSON_URL: ${{ vars.DAILY_RAIN_JSON_URL }}
      DAILY_RAIN_CSV_URL: ${{ vars.DAILY_RAIN_CSV_URL }}
      DAILY_RAIN_CSV_URLS: ${{ vars.DAILY_RAIN_CSV_URLS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skip when Google Sheets CSV URL is not configured
        if: ${{ env.DAILY_RAIN_JSON_URL == '' && env.DAILY_RAIN_CSV_URL == '' && env.DAILY_RAIN_CSV_URLS == '' }}
        run: |
          echo "DAILY_RAIN_JSON_URL, DAILY_RAIN_CSV_URL or DAILY_RAIN_CSV_URLS repository variable is not configured. Skipping update."

      - name: Build daily JSON from Google Sheets or Apps Script
        if: ${{ env.DAILY_RAIN_JSON_URL != '' || env.DAILY_RAIN_CSV_URL != '' || env.DAILY_RAIN_CSV_URLS != '' }}
        shell: pwsh
        run: ./scripts/build-daily-data.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-daily-history.txt

      - name: Install historical Excel readers
        run: python -m pip install -r scripts/requirements-daily-history.txt

      - name: Import and combine historical daily rainfall
        run: python scripts/import-daily-history.py

      - name: Validate historical and combined daily rainfall
        run: python scripts/validate-daily-history.py

      - name: Build department climate status
        run: python scripts/build-department-climate-status.py

      - name: Refresh complete point-source cache
        run: python scripts/update-map-point-sources.py

      - name: Validate dashboard and primary-source contracts
        run: npm test

      - name: Commit updated daily data
        run: |
          set -euo pipefail
          if git diff --quiet -- data/rainfall-daily.json data/rainfall-daily-summary.json data/rainfall-daily-history.json data/rainfall-daily-combined.json data/department-climate-status.json data/map-point-sources.json; then
            echo "No daily data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rainfall-daily.json data/rainfall-daily-summary.json data/rainfall-daily-history.json data/rainfall-daily-combined.json data/department-climate-status.json data/map-point-sources.json
          git commit -m "Update daily rainfall data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public site from allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data/geo
          cp index.html app.js styles.css climate-controls.css operational.css _site/
          cp data/rainfall.json data/rainfall-daily.json data/rainfall-daily-history.json data/rainfall-daily-combined.json data/rainfall-daily-summary.json data/stations.json data/metadata.json data/department-climate-status.json data/stations-climate-status.json data/external-api-config.json data/map-point-sources.json _site/data/
          cp data/geo/corrientes-departamentos.geojson _site/data/geo/
          touch _site/.nojekyll

      - name: Verify private files are excluded
        shell: bash
        run: |
          set -euo pipefail
          if find _site -type f \( -name "*.xls" -o -name "*.xlsx" -o -name "*.ps1" -o -name "*.md" \) | grep -q .; then
            echo "Private or internal files found in the public artifact."
            exit 1
          fi
          test -s _site/data/external-api-config.json
          test -s _site/data/map-point-sources.json
          find _site -maxdepth 3 -type f -print

      - name: Upload public dashboard only
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
