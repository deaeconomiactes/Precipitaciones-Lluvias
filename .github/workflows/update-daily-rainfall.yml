name: Update daily rainfall data

on:
  schedule:
    # GitHub Actions usa UTC. 12:30 UTC = 09:30 Argentina.
    # Segundo intento: 13:30 UTC = 10:30 Argentina.
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-rainfall-update
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DAILY_RAIN_JSON_URL: ${{ vars.DAILY_RAIN_JSON_URL }}
      DAILY_RAIN_CSV_URL: ${{ vars.DAILY_RAIN_CSV_URL }}
      DAILY_RAIN_CSV_URLS: ${{ vars.DAILY_RAIN_CSV_URLS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate daily rainfall source configuration
        run: |
          set -euo pipefail
          echo "[daily-rainfall] Inicio de actualización."
          echo "[daily-rainfall] UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "[daily-rainfall] Argentina: $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M:%S %Z')"
          if [ -z "$DAILY_RAIN_JSON_URL" ] && [ -z "$DAILY_RAIN_CSV_URL" ] && [ -z "$DAILY_RAIN_CSV_URLS" ]; then
            echo "ERROR: no está configurada ninguna fuente diaria (DAILY_RAIN_JSON_URL, DAILY_RAIN_CSV_URL o DAILY_RAIN_CSV_URLS)."
            exit 1
          fi
          echo "[daily-rainfall] Fuente diaria configurada."

      - name: Build daily JSON from Google Sheets or Apps Script
        shell: pwsh
        run: |
          Write-Host "[daily-rainfall] Ejecutando scripts/build-daily-data.ps1"
          $global:LASTEXITCODE = 0
          ./scripts/build-daily-data.ps1
          $scriptExitCode = $LASTEXITCODE
          if ($scriptExitCode -ne 0) { throw "build-daily-data.ps1 terminó con código $scriptExitCode" }
          $global:LASTEXITCODE = 0

      - name: Validate generated daily metadata
        run: |
          echo "[daily-rainfall] Validando data/rainfall-daily-summary.json"
          node scripts/validate-daily-rainfall.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-daily-history.txt

      - name: Install historical Excel readers
        run: python -m pip install -r scripts/requirements-daily-history.txt

      - name: Import and combine historical daily rainfall
        run: |
          echo "[daily-rainfall] Ejecutando scripts/import-daily-history.py"
          python scripts/import-daily-history.py

      - name: Validate historical and combined daily rainfall
        run: |
          echo "[daily-rainfall] Validando históricos y combinado"
          python scripts/validate-daily-history.py

      - name: Build department climate status
        run: |
          echo "[daily-rainfall] Ejecutando scripts/build-department-climate-status.py"
          python scripts/build-department-climate-status.py

      - name: Validate daily rainfall contracts
        run: |
          echo "[daily-rainfall] Ejecutando npm run test:daily"
          npm run test:daily

      - name: Commit updated daily data
        id: commit
        run: |
          set -euo pipefail
          expected_files=(
            data/rainfall-daily.json
            data/rainfall-daily-summary.json
            data/rainfall-daily-history.json
            data/rainfall-daily-combined.json
            data/department-climate-status.json
          )
          echo "[daily-rainfall] Archivos esperados: ${expected_files[*]}"
          echo "[daily-rainfall] Estado antes del commit:"
          git status --short
          changed_files_output="$(python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected_files = [
              "data/rainfall-daily.json",
              "data/rainfall-daily-summary.json",
              "data/rainfall-daily-history.json",
              "data/rainfall-daily-combined.json",
              "data/department-climate-status.json",
          ]

          def read_json(path: str, content: bytes):
              try:
                  return json.loads(content.decode("utf-8-sig"))
              except Exception as exc:
                  raise SystemExit(f"ERROR: JSON inválido en {path}: {exc}") from exc

          def head_json(path: str):
              result = subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True)
              if result.returncode:
                  return None
              return read_json(path, result.stdout)

          def comparable(path: str, value):
              if path.endswith("rainfall-daily-summary.json"):
                  value = dict(value)
                  # La consulta diaria puede modificar estas dos marcas sin datos nuevos.
                  value.pop("generatedAt", None)
                  value.pop("daysSinceLatestData", None)
              elif path.endswith("department-climate-status.json"):
                  value = [{key: item for key, item in row.items() if key != "updatedAt"} for row in value]
              return value

          for file_path in expected_files:
              working_path = Path(file_path)
              if not working_path.is_file():
                  raise SystemExit(f"ERROR: falta el archivo esperado {file_path}.")
              current = read_json(file_path, working_path.read_bytes())
              previous = head_json(file_path)
              if previous is None or comparable(file_path, current) != comparable(file_path, previous):
                  print(file_path)
          PY
          )"
          changed_files=()
          while IFS= read -r file_path; do
            if [ -n "$file_path" ]; then changed_files+=("$file_path"); fi
          done <<< "$changed_files_output"
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "[daily-rainfall] Fuente consultada correctamente; no hay registros ni metadata sustantiva nuevos."
            echo "[daily-rainfall] Se evita el commit: solo variaron marcas de generación o formato no semántico."
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[daily-rainfall] Archivos con cambios sustantivos: ${changed_files[*]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed_files[@]}"
          git commit -m "Update daily rainfall data"
          echo "[daily-rainfall] Commit creado: $(git rev-parse --short HEAD)"
          git push
          echo "[daily-rainfall] Push realizado a main."
          echo "changes_detected=true" >> "$GITHUB_OUTPUT"

      - name: Daily rainfall healthcheck
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("data/rainfall-daily-summary.json").read_text(encoding="utf-8-sig"))
          departments = summary.get("departments") or []
          print(f"[daily-rainfall] Última fecha diaria real: {summary.get('latestDataDate') or summary.get('dateMax')}")
          print(f"[daily-rainfall] Registros diarios: {summary.get('records')}")
          print(f"[daily-rainfall] Departamentos con datos recientes: {len(departments)}")
          print(f"[daily-rainfall] generatedAt: {summary.get('generatedAt')}")
          print(f"[daily-rainfall] daysSinceLatestData: {summary.get('daysSinceLatestData')}")
          print(f"[daily-rainfall] freshnessStatus: {summary.get('freshnessStatus')}")
          PY

      - name: Configure GitHub Pages
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: actions/configure-pages@v5

      - name: Build public site from allowlist
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data/geo
          cp index.html app.js styles.css climate-controls.css operational.css _site/
          cp data/rainfall.json data/rainfall-daily.json data/rainfall-daily-history.json data/rainfall-daily-combined.json data/rainfall-daily-summary.json data/stations.json data/metadata.json data/department-climate-status.json data/stations-climate-status.json data/external-api-config.json data/map-point-sources.json data/source-catalog.json data/source-health.json data/source-cross-validation.json _site/data/
          cp data/geo/corrientes-departamentos.geojson _site/data/geo/
          touch _site/.nojekyll

      - name: Verify private files are excluded
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if find _site -type f \( -name "*.xls" -o -name "*.xlsx" -o -name "*.ps1" -o -name "*.md" \) | grep -q .; then
            echo "Private or internal files found in the public artifact."
            exit 1
          fi
          test -s _site/data/external-api-config.json
          test -s _site/data/map-point-sources.json
          find _site -maxdepth 3 -type f -print

      - name: Upload public dashboard only
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: ${{ steps.commit.outputs.changes_detected == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
